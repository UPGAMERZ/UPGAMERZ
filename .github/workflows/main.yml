name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        net user runneradmin P@ssw0rd123 /add
        net localgroup administrators runneradmin /add
        reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.ps1 | powershell -

    - name: Connect to Tailscale
      run: |
        "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TS_AUTHKEY }} --hostname=github-rdp

    - name: Show Tailscale IP
      run: |
        "C:\Program Files\Tailscale\tailscale.exe" ip -4

    - name: Keep Runner Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }      run: |
        Write-Host "RDP is ready for 12 hours..."
        Start-Sleep -Seconds 43200  # 12 hours
