name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      shell: powershell
      run: |
        net user runneradmin P@ssw0rd123 /add 2>$null
        net localgroup administrators runneradmin /add 2>$null
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Install Tailscale
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://tailscale.com/install.ps1" -OutFile "install.ps1"
        powershell -ExecutionPolicy Bypass -File install.ps1

    - name: Connect to Tailscale
      shell: powershell
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TS_AUTHKEY }} --hostname=github-rdp

    - name: Show Tailscale IP
      shell: powershell
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" ip -4

    - name: Keep Alive
      shell: powershell
      run: |
        Start-Sleep -Seconds 21600
